<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c43" />
      <stop offset="100%" stop-color="#083823" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="96" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Circular Text Path for UNIVERSITY OF ABRA -->
  <path id="textCircle" d="M 24,100 A 76,76 0 1,1 176,100" fill="none" stroke="none" />
  <text font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="2.5">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF ABRA
    </textPath>
  </text>

  <!-- Circular Text Path for PHILIPPINES & EST. -->
  <path id="bottomTextCircle" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" stroke="none" />
  <text font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="9" font-weight="bold" fill="#ffd700" letter-spacing="2">
    <textPath href="#bottomTextCircle" startOffset="50%" text-anchor="middle">
      • RA 11574 • PHILIPPINES •
    </textPath>
  </text>

  <!-- Inner Gold Medallion Ring -->
  <circle cx="100" cy="100" r="62" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Mountain Peaks of Abra Valley (Background) -->
  <polygon points="50,118 78,82 104,118" fill="#146c43" opacity="0.85" />
  <polygon points="86,118 116,74 150,118" fill="#0b482c" opacity="0.9" />

  <!-- Sun with Rays rising behind mountains -->
  <circle cx="100" cy="85" r="14" fill="#ffd700" />
  <line x1="100" y1="65" x2="100" y2="58" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" />
  <line x1="84" y1="71" x2="79" y2="66" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" />
  <line x1="116" y1="71" x2="121" y2="66" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round" />

  <!-- Gear of Technology / Industrial Advancement (Left) -->
  <g transform="translate(62,122) scale(0.65)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#d4af37" stroke-width="5" />
    <circle cx="20" cy="20" r="6" fill="#083823" />
    <rect x="17" y="2" width="6" height="5" fill="#d4af37" />
    <rect x="17" y="33" width="6" height="5" fill="#d4af37" />
    <rect x="2" y="17" width="5" height="6" fill="#d4af37" />
    <rect x="33" y="17" width="5" height="6" fill="#d4af37" />
  </g>

  <!-- Rice/Agri stalk (Right) -->
  <path d="M 125,142 Q 135,130 134,115 Q 138,124 142,128" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="132" cy="120" rx="3" ry="5" fill="#ffd700" transform="rotate(20 132 120)" />
  <ellipse cx="138" cy="126" rx="3" ry="5" fill="#ffd700" transform="rotate(45 138 126)" />

  <!-- Open Book of Knowledge in Foreground -->
  <path d="M 72,132 C 84,124 98,128 100,134 C 102,128 116,124 128,132 L 128,145 C 116,138 102,141 100,147 C 98,141 84,138 72,145 Z" fill="#ffffff" stroke="#083823" stroke-width="2" />
  <line x1="100" y1="134" x2="100" y2="147" stroke="#083823" stroke-width="2" />

  <!-- Flaming Torch of Enlightenment Centered -->
  <path d="M 98,132 L 96,110 L 104,110 L 102,132 Z" fill="#b8972b" stroke="#083823" stroke-width="1" />
  <path d="M 100,92 C 94,98 96,104 100,108 C 104,104 106,98 100,92 Z" fill="#ff4d4d" />
  <path d="M 100,96 C 97,100 98,103 100,106 C 102,103 103,100 100,96 Z" fill="#ffa500" />
</svg>
